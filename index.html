<!doctype html>
<html lang="br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Botao rede social 3D | Alan Costa de Oliveira</title>
    <link rel="stylesheet" href="style.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
  </head>
  <body>
    <div class="glass-container">
      <!-- Facebook Button -->
      <a
        href="https://www.facebook.com/alancosta.oliveira.1"
        class="glass-btn facebook"
        style="--clr: #1877f2"
      >
        <div class="icon-box">
          <i class="fab fa-facebook-f icon"></i>
          <span class="text">Facebook</span>
        </div>
      </a>

      <!-- X (Twitter) Button -->
      <a href="#" class="glass-btn twitter" style="--clr: #1da1f2">
        <div class="icon-box">
          <i class="fab fa-x-twitter icon"></i>
          <span class="text">Twitter</span>
        </div>
      </a>

      <!-- Google Button -->
      <a href="#" class="glass-btn google" style="--clr: #ea4335">
        <div class="icon-box">
          <i class="fab fa-google icon"></i>
          <span class="text">Google</span>
        </div>
      </a>

      <!-- Instagram Button -->
      <a href="#" class="glass-btn instagram" style="--clr: #e1306c">
        <div class="icon-box">
          <i class="fab fa-instagram icon"></i>
          <span class="text">Instagram</span>
        </div>
      </a>
    </div>
  </body>
</html>
